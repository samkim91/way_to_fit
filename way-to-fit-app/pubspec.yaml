name: way_to_fit_app
description: Way To Fit competition participant app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  json_annotation: ^4.11.0
  retrofit: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf
