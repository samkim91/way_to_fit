spring:
  application:
    name: way-to-fit
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/waytofit
    username: ${DB_USERNAME:waytofit}
    password: ${DB_PASSWORD:waytofit}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    mapper:
      ACCEPT_CASE_INSENSITIVE_ENUMS: true
    deserialization:
      READ_UNKNOWN_ENUM_VALUES_AS_NULL: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000     # 1시간 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)
  cookie-secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI}
  allowed-redirect-uris: ${OAUTH2_ALLOWED_REDIRECT_URIS:waytofit://auth/callback,http://localhost:3000/auth/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:[]}

server:
  port: 8080
